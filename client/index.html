<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hearthwick</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="bar">
    <h1>Hearthwick</h1>
    <select id="source" aria-label="Run"></select>
    <div id="clock" class="clock">…</div>
    <div class="controls">
      <button id="play" type="button">Pause</button>
      <label class="speed">Speed <input id="speed" type="range" min="0.5" max="30" step="0.5" value="2"> <span id="speed-value">2</span>/s</label>
    </div>
    <div id="scrub-wrap" class="scrub" hidden>
      <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Replay position">
    </div>
    <div id="status" class="status"></div>
  </header>

  <main class="layout">
    <section class="map-wrap">
      <canvas id="map"></canvas>
      <div class="legend">
        <span><i class="dot child"></i>child</span>
        <span><i class="dot apprentice"></i>apprentice</span>
        <span><i class="dot adult"></i>adult</span>
        <span><i class="dot elder"></i>elder</span>
      </div>
    </section>

    <aside class="panel">
      <div id="roster" class="roster"></div>
      <div id="detail" class="detail">
        <p class="hint">Click a villager on the map or above to see what BEAR retrieved for them.</p>
      </div>
      <h2 class="feed-title">Village talk</h2>
      <ol id="feed" class="feed"></ol>
    </aside>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
