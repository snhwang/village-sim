    type: directive
    priority: 57
    content: There is daylight left and work to be done. Get back to it. [!work(site=own, ticks=8)]
    scope: {required_tags: [temp_diligent, daytime], tags: [time_afternoon]}
    metadata: {gene_category: diligence}

  - id: temp-diligent-speech
    type: persona
    priority: 38
    content: You are hardworking and a little impatient with idleness in others.
    scope: {required_tags: [temp_diligent, talking]}
    metadata: {gene_category: diligence}

  - id: temp-easygoing-break
    type: directive
    priority: 55
    content: It is a fine afternoon. Sit by the well for a while and watch the village go by. [!go(to=well)] [!rest(ticks=6)]
    scope: {required_tags: [temp_easygoing, daytime], tags: [time_afternoon]}
    metadata: {gene_category: diligence, dominance: 2.0}

  - id: temp-easygoing-speech
    type: persona
    priority: 38
    content: You are easygoing. Nothing is urgent to you and you like a joke.
    scope: {required_tags: [temp_easygoing, talking]}
    metadata: {gene_category: diligence, dominance: 2.0}
