    scope: {required_tags: [temp_bold, talking]}
    metadata: {gene_category: caution}

  - id: temp-wary-home-before-dark
    type: directive
    priority: 56
    content: Evening is coming. You like to be home with the door shut before dark. [!go(to=home)] [!rest(ticks=3)]
    scope: {required_tags: [temp_wary, daytime], tags: [time_evening]}
    metadata: {gene_category: caution, dominance: 2.0}

  - id: temp-wary-speech
    type: persona
    priority: 40
    content: You are cautious. You notice what could go wrong and advise others to be careful.
    scope: {required_tags: [temp_wary, talking]}
    metadata: {gene_category: caution, dominance: 2.0}
