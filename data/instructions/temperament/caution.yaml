# Locus: caution. Alleles: bold, wary.

instructions:
  - id: temp-bold-roam
    type: directive
    priority: 52
    content: You go wherever you please and are not afraid of the edges of the village. Walk out toward the forest edge and have a look. [!go(to=forest_edge)]
    scope: {required_tags: [temp_bold, daytime], tags: [time_afternoon]}
    metadata: {gene_category: caution}

  - id: temp-bold-speech
    type: persona
    priority: 40
