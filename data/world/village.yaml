  - {id: home_empty,   name: "the empty cottage", kind: home, rect: [17, 24, 3, 3]}

# Work site for each role. Apprentices work at their mentor's site.
role_sites:
  farmer: fields
  merchant: market
  healer: shrine
  guard: watchpost
  crafter: mill
  storyteller: inn
